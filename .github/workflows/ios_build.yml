name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd apps/mobile
          flutter pub get
          # Fix Xcode 16 AVCaptureSession notification symbols in camera_avfoundation
          find /Users/runner/.pub-cache -name "DefaultCamera.swift" -exec sed -i '' 's/AVCaptureSession\.wasInterruptedNotification/NSNotification.Name.AVCaptureSessionWasInterrupted/g' {} +
          find /Users/runner/.pub-cache -name "DefaultCamera.swift" -exec sed -i '' 's/AVCaptureSession\.runtimeErrorNotification/NSNotification.Name.AVCaptureSessionRuntimeError/g' {} +

      - name: Build iOS App with xcodebuild
        run: |
          cd apps/mobile
          flutter build ios --config-only
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build_dir \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          cd ../../

      - name: Package into IPA Payload
        run: |
          mkdir -p build_output/Payload
          cp -r apps/mobile/ios/build_dir/Build/Products/Release-iphoneos/Runner.app build_output/Payload/
          cd build_output
          zip -r NeuroBridge_Asha.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroBridge_Asha_iOS
          path: build_output/NeuroBridge_Asha.ipa
