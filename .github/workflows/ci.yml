name: FingerSpeak checks

on:
  push:
  pull_request:

jobs:
  flutter-mobile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build local-development APK
        run: >-
          flutter build apk --debug
          --dart-define=FINGERSPEAK_API_BASE_URL=http://10.0.2.2:8000/v1
          --dart-define=FINGERSPEAK_PI_WS_URL=ws://10.0.2.2:8765/v1/device/ws
      - uses: actions/upload-artifact@v4
        with:
          name: fingerspeak-mobile-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  react-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: node --test tests/rendered-html.test.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "services/api[dev]" -e "services/ml[dev]" -e "services/edge[dev]"
      - run: python -m pytest -q services/api/tests services/ml/tests services/edge/tests
      - run: python -m ruff check services/api services/ml services/edge
      - run: python -m compileall -q services/api/src services/ml/src services/edge/src

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose.yaml config --quiet
      - run: docker compose -f infra/compose.yaml build api web

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fingerspeak_test
          POSTGRES_USER: fingerspeak
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fingerspeak -d fingerspeak_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: services/api
    env:
      FINGERSPEAK_ENVIRONMENT: test
      FINGERSPEAK_DATABASE_URL: postgresql+asyncpg://fingerspeak:test-only-password@127.0.0.1:5432/fingerspeak_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: alembic current --check-heads
