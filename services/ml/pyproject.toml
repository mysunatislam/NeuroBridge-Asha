[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fingerspeak-ml"
version = "0.1.0"
description = "Local-first feature extraction, baseline models, and optional TensorFlow training for FingerSpeak"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
tensorflow = [
  "tensorflow>=2.16,<3",
  "tensorflowjs>=4.17,<5",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
fingerspeak-ml = "fingerspeak_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fingerspeak_ml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["fingerspeak_ml"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["fingerspeak_ml", "tests"]
