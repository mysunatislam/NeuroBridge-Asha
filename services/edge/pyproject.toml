[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fingerspeak-edge"
version = "0.1.0"
description = "Authenticated Raspberry Pi edge bridge and hardware-free simulator for FingerSpeak"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "pydantic>=2.12,<3",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
# Raspberry Pi OS provides Picamera2 through apt. These extras add only the local
# Face Landmarker runtime and intentionally remain absent from normal simulator/CI installs.
vision = [
  "mediapipe>=0.10.14,<0.11",
  "numpy>=1.26,<3",
]
hardware = [
  "mediapipe>=0.10.14,<0.11",
  "numpy>=1.26,<3",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
fingerspeak-edge = "fingerspeak_edge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fingerspeak_edge"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["fingerspeak_edge", "tests"]
