name: fingerspeak_mobile
description: Mobile patient and caregiver companion for FingerSpeak Asha.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  camera: ^0.12.0+2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^9.2.4
  flutter_tts: ^4.2.2
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_pose_detection: ^0.14.1
  http: ^1.3.0
  just_audio: ^0.9.42
  path_provider: ^2.1.5
  record: ^6.0.0
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  web_socket_channel: ^3.0.2
  permission_handler: ^11.3.1
  flutter_inappwebview: ^6.1.5
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/asha-avatar.webp
    - assets/web/fingerspeak_studio.html
    - assets/web/fingerspeak_hand_runtime.js
    - assets/web/wasm/
    - assets/web/models/
